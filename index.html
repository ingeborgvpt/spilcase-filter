
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spilkatalog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="topbar"></div>

    <div class="container">
        <header>
            <h1>Spilkataloget</h1>
        </header>

        <main>
            <!-- Søgning -->
             
            <div class="search-container">
              <span class="bi--search"></span>
                <input
                    type="search"
                    id="search-input"
                    placeholder= "Søg efter spil..." 
                    class="search-input"
                    aria-label="Søg efter spil"
                >
            </div>

            <!-- Åbn filterpanelet -->
            <button
                type="button"
                id="filter-toggle"
                class="filter-button"
            >
            <a href="filter.html" id="filter-toggle" class="filter-button">
               <span class="boxicons--filter-filled"></span> Filtrer</span>
               </a>
            </button>

            <!-- Spillene indsættes her med JavaScript -->
            <div id="products-container" class="products-container"></div>
        </main>
    </div>

    <!-- JavaScript -->
    <script src="data.js"></script>
    <script src="scriptui.js"></script>
    <script src="scriptfilt.js"></script>
</body>
</html>
